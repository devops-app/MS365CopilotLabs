<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <style>
      /* ===== Base ===== */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        color: #24292e;
        background: #fff;
      }

      /* ===== Header ===== */
      .page-header {
        padding: 3em 1em;
        text-align: center;
        color: #fff;
        background: linear-gradient(135deg, #155799, #159957);
      }
      .page-header h1 {
        margin: 0 0 0.25em;
        font-size: 2.2em;
        font-weight: 700;
      }
      .page-header p {
        margin: 0;
        font-size: 1.1em;
        opacity: 0.9;
      }

      /* ===== Main - WIDE ===== */
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2em 1.5em 4em;
      }

      /* ===== Navigation Bar ===== */
      .nav-bar {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0.75em 1.5em;
        background: #f6f8fa;
        border-bottom: 1px solid #dfe2e5;
        display: flex;
        align-items: center;
        gap: 1em;
        flex-wrap: wrap;
      }
      .nav-bar a {
        color: #0366d6;
        text-decoration: none;
        font-size: 0.9em;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 0.3em;
      }
      .nav-bar a:hover {
        text-decoration: underline;
      }
      .nav-bar .nav-separator {
        color: #dfe2e5;
        font-size: 0.8em;
      }

      /* ===== Typography ===== */
      h1, h2, h3, h4 { margin-top: 1.5em; margin-bottom: 0.5em; }
      h1 { font-size: 1.8em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
      h2 { font-size: 1.4em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
      h3 { font-size: 1.2em; }
      p { margin: 0 0 1em; }
      a { color: #0366d6; text-decoration: none; }
      a:hover { text-decoration: underline; }

      /* ===== Tables ===== */
      table {
        display: block;
        width: 100%;
        max-width: 100%;
        margin: 1em 0;
        overflow-x: auto;
        border-collapse: collapse;
      }
      table th, table td {
        padding: 0.5em 0.75em;
        border: 1px solid #dfe2e5;
        text-align: left;
      }
      table th { background: #f6f8fa; font-weight: 600; }
      table tr:nth-child(even) { background: #f6f8fa; }

      /* ===== Blocks ===== */
      blockquote {
        margin: 1em 0;
        padding: 0.5em 1em;
        border-left: 4px solid #159957;
        background: #f6f8fa;
      }
      code {
        padding: 0.2em 0.4em;
        background: #f6f8fa;
        border-radius: 3px;
        font-size: 0.9em;
      }
      pre {
        padding: 1em;
        background: #f6f8fa;
        border-radius: 6px;
        overflow-x: auto;
      }
      pre code { padding: 0; background: none; }

      /* ===== Warning/Tip boxes ===== */
      .admonition {
        padding: 1em 1.2em;
        margin: 1em 0;
        border-radius: 6px;
        border-left: 4px solid;
      }
      .admonition-important {
        background: #fff3cd;
        border-color: #ffc107;
      }
      .admonition-tip {
        background: #d4edda;
        border-color: #28a745;
      }
    </style>
  </head>
  <body>
    <div class="page-header">
      <h1>{{ site.title }}</h1>
      <p>{{ site.description }}</p>
    </div>
    <nav class="nav-bar">
      <a href="{{ '/' | relative_url }}">← Back to Home</a>
    </nav>
    <main>
      {{ content }}
    </main>
  </body>
</html>
